name: Build Android installer

on:
  push:
    branches: [main, feature/cosmetics-and-google-play]
  pull_request:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Optional release AAB (no Play upload)'
        type: choice
        default: none
        options: [none, unsigned, signed]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete Godot project
        uses: actions/checkout@v4

      - name: Set up Android and Godot
        uses: ./.github/actions/setup-android

      - name: Prepare Android project, test game, and build debug APK
        shell: bash
        run: bash tools/build_android.sh

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sky-bounce-android-installer
          path: |
            builds/sky-bounce.apk
            builds/sky-bounce.apk.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_mode != 'none'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Android and Godot
        uses: ./.github/actions/setup-android
      - name: Build release App Bundle without publishing
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: python3 tools/build_release.py
      - name: Upload release bundle and verification report
        uses: actions/upload-artifact@v4
        with:
          name: sky-bounce-release-${{ inputs.release_mode }}
          path: |
            builds/release/*.aab
            builds/release/*.sha256
            builds/release/*verification.json
          if-no-files-found: error
          retention-days: 14
