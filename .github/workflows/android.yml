name: Build Android installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete Godot project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install SDK matching Godot 4.6.3
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865'

      - name: Install official Godot 4.6.3 Standard
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c  /tmp/godot.zip' | sha512sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Cache verified Godot Android templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.6.3.stable
          key: godot-4.6.3-android-c260fe8a

      - name: Cache Gradle dependencies and debug testing key
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.config/godot/sky-bounce-debug.keystore
          key: android-debug-${{ runner.os }}-${{ hashFiles('android/build/**/*.gradle', 'android/build/gradle.properties', 'android/build/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-debug-${{ runner.os }}-

      - name: Prepare Android project, test game, and build debug APK
        shell: bash
        run: bash tools/build_android.sh

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: sky-bounce-android-installer
          path: |
            builds/sky-bounce.apk
            builds/sky-bounce.apk.sha256
          if-no-files-found: error
          retention-days: 14
